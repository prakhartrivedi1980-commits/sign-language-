
dataset:
  num_classes: 64
  num_frames: 16

training:
  device: cuda
  seed: 42
  batch_size: 1
  num_workers: 0
  pin_memory: true
  frame_chunk_size: 4
  gradient_accumulation_steps: 4
  mixed_precision: true
  head_epochs: 1
  finetune_epochs: 0
  head_learning_rate: 0.001
  finetune_learning_rate: 0.0001
  weight_decay: 0.0001
  patience: 5
  save_every_epoch: true

output:
  checkpoint_dir: checkpoints/vision_smoke
  history_file: results/vision_smoke_history.csv
